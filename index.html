<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#223A60">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PRAYERFLOW Pilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: left rail on wide screens, bottom tab bar on phones. One calm reading column per page; the player is a full-screen layer. */
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --sunken:#E9ECF3; --ink:#18202F; --ink2:#4A566B; --line:#D3D9E5;
  --primary:#223A60; --on-primary:#FFFFFF; --accent:#8A5A12; --accent-soft:#F3E8D2;
  --good:#24663F; --good-soft:#DDEFE3; --warn:#9A3A2B; --warn-soft:#F6E1DC; --mid:#6E5200; --mid-soft:#F6EBC8;
  --display:'Lora',Georgia,'Times New Roman',serif;
  --ui:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --scale:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1525; --surface:#16203A; --sunken:#1D2947; --ink:#E9EDF6; --ink2:#A8B3C9; --line:#2C3957;
  --primary:#E2B960; --on-primary:#1A1405; --accent:#E2B960; --accent-soft:#2F2A1B;
  --good:#6FCB92; --good-soft:#17301F; --warn:#F09A8A; --warn-soft:#3A1E1A; --mid:#E8C766; --mid-soft:#35300F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1525; --surface:#16203A; --sunken:#1D2947; --ink:#E9EDF6; --ink2:#A8B3C9; --line:#2C3957;
  --primary:#E2B960; --on-primary:#1A1405; --accent:#E2B960; --accent-soft:#2F2A1B;
  --good:#6FCB92; --good-soft:#17301F; --warn:#F09A8A; --warn-soft:#3A1E1A; --mid:#E8C766; --mid-soft:#35300F; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
p{margin:0}

.app{max-width:1180px;margin:0 auto}
.side{display:contents}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;padding-block:16px 6px;text-decoration:none}
.brand .mark{font:600 15px/1 var(--display);letter-spacing:.2em}
.brand .sub{font:italic 400 14px/1 var(--display);color:var(--ink2)}
.brand .tag{flex-basis:100%;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--accent)}
.side-foot{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav a{flex:1;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--ink2);text-decoration:none;border-radius:10px;padding:4px 2px}
.nav a svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current=page]{color:var(--accent);background:var(--sunken)}
.nav .full{display:none}
main{padding-block:10px 110px;min-width:0}

@media(min-width:900px){
  .app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px}
  .side{display:flex;flex-direction:column;gap:26px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding-block:30px}
  .brand{flex-direction:column;gap:6px;padding:0;border-bottom:1px solid var(--line);padding-bottom:20px}
  .brand .mark{font-size:20px}
  .nav{position:static;flex-direction:column;border:0;background:none;padding:0;gap:2px}
  .nav a{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;min-height:46px;padding:8px 12px}
  .nav .short{display:none}.nav .full{display:inline}
  .side-foot{display:block;font-size:12.5px;color:var(--ink2)}
  main{padding-block:34px 70px}
}

/* page header */
.ph{display:grid;gap:8px;margin-bottom:22px}
.ph h1{font-weight:600;font-size:clamp(1.7rem,4.2vw,2.35rem);line-height:1.15}
.ph p{color:var(--ink2);max-width:62ch}

/* controls */
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn.big{min-height:56px;font-size:17px;padding:0 28px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:42px;width:100%}
textarea{min-height:90px;resize:vertical}
input[type=radio]{width:20px;height:20px;min-height:0;accent-color:var(--primary)}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--primary)}
label.fld{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--ink2)}
label.fld input,label.fld select,label.fld textarea{font-weight:400;color:var(--ink)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sunken);color:var(--ink2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.mid{background:var(--mid-soft);color:var(--mid)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:3px;background:var(--sunken);padding:3px;border-radius:10px;width:fit-content;max-width:100%}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:8px;background:none;font-weight:600;font-size:13.5px;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.tools input[type=search]{flex:1 1 220px;max-width:340px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:13.5px;color:var(--ink2);max-width:66ch}
.size{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.size button{min-height:36px;min-width:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.back{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}

/* lists */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list>li{border-bottom:1px solid var(--line)}
.rowbtn{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;width:100%;text-align:left;background:none;border:0;padding:14px 4px;min-height:56px;cursor:pointer}
.rowbtn:hover{background:var(--sunken)}
.rowbtn .t{font:500 1.08rem/1.3 var(--display)}
.rowbtn .s{flex-basis:100%;font-size:13.5px;color:var(--ink2)}
.rowbtn.on{background:var(--sunken);box-shadow:inset 3px 0 0 var(--accent)}
.empty{padding:22px 4px;color:var(--ink2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px;display:grid;gap:14px}
.panel h2{font-size:1.35rem}
.panel h3{font-size:1.05rem}
details{margin-top:14px}
summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
.own{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 16px 16px;margin-top:22px}
.own .grid{display:grid;gap:12px;margin-top:6px}

/* reader */
.reader h1{font-size:clamp(1.8rem,4.5vw,2.6rem);margin:8px 0 18px}
.prayer{font:400 calc(1.2rem*var(--scale))/1.75 var(--display);max-width:36em}
.prayer p+p{margin-top:.9em}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13.5px;margin:28px 0 0;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts dt{color:var(--ink2)}.facts dd{margin:0;font-weight:500}
.picker{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.picker h3{margin:0}.webq{padding:12px 4px;list-style:none}
.addbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:22px}
.addbar select{flex:1 1 200px;max-width:320px}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}

/* rosary & novenas */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0 0}
.setbtn{display:grid;gap:3px;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:68px}
.setbtn .d{font:600 1.1rem var(--display)}
.setbtn .s{font-size:12.5px;color:var(--ink2)}
.setbtn[aria-checked=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.myst{margin:0;padding-left:1.4em;display:grid;gap:6px;font:400 1.1rem/1.5 var(--display)}
.seq ol{margin:10px 0 0;padding-left:1.6em;display:grid;gap:3px;font-size:14px}
.days{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.day{width:100%;min-height:58px;text-align:left;display:grid;gap:1px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.day b{font-size:13px}.day span{font-size:12px;color:var(--ink2)}
.day[aria-pressed=true]{background:var(--good-soft);border-color:var(--good)}
.day[aria-pressed=true] b::after{content:" · prayed"}
.build{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.build select{width:auto;min-width:130px}

/* playlists */
.split{display:grid;gap:26px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.split{grid-template-columns:290px minmax(0,1fr)}.back-pl{display:none}}
@media(max-width:899px){.split.has-sel .plist{display:none}.split:not(.has-sel) .editor{display:none}}
.plist h2,.editor h2{font-size:1.15rem;margin-bottom:10px}
.plist .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.editor{display:grid;gap:14px;align-content:start;min-width:0}
.editor.empty{border:1px dashed var(--line);border-radius:14px;padding:30px;color:var(--ink2);align-content:center;justify-items:start}
.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.it{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:6px 12px;padding:12px 2px;border-bottom:1px solid var(--line);align-items:start}
.it .n{font:600 14px var(--display);color:var(--accent);padding-top:3px}
.it .main{display:grid;gap:8px;min-width:0}
.it .head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.it .head strong{font:500 1.02rem var(--display)}
.it .side2{display:flex;gap:6px;align-items:center}
.it .side2 input{width:62px;min-height:36px;padding:4px 8px}
.it .side2 button{min-width:38px;min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.it details{margin:0}
.it textarea{min-height:76px}
@media(max-width:560px){.it{grid-template-columns:24px minmax(0,1fr)}.it .side2{grid-column:2;flex-wrap:wrap}}
.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
@media(min-width:900px){.savebar{bottom:12px}}
pre.pkg{margin:0;max-height:260px;overflow:auto;background:var(--sunken);padding:12px;border-radius:10px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}

/* hymns */
.hy{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:14px 2px}
.hy .nm{flex:1 1 240px;min-width:0}
.hy .nm b{font:500 1.08rem var(--display)}
.hy .nm small{display:block;color:var(--ink2);font-size:13px}
.hy .hynote{flex:1 1 100%}.hy .hynote summary{cursor:pointer;font-size:13px;color:var(--ink2)}
.hy .chips{display:flex;flex-wrap:wrap;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--ink2);margin:6px 0 14px;align-items:center}
.mediaform{display:grid;gap:12px}
.mi{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 2px}
.mi .nm{flex:1 1 220px;min-width:0}
.mi video,.mi audio{width:100%;max-width:520px;margin-top:8px}
.err{color:var(--warn);font-weight:600;font-size:13.5px}

/* parish */
.slot{display:grid;gap:8px;padding:14px 2px;border-bottom:1px solid var(--line)}
.slot .g{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.slot b{font:500 1.02rem var(--display)}
.roles{display:grid;gap:0;margin:0;padding:0;list-style:none}
.roles li{display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.roles b{min-width:110px}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 10px 10px 0;font-size:14px;max-width:70ch}

/* content & rights */
#policy{position:fixed;inset:0;z-index:70;background:rgba(8,12,22,.6);display:flex;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.pcard{margin:auto;width:100%;max-width:640px;max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:12px}
.pcard h2{font-size:1.4rem}.pcard h3{font-size:1.02rem;margin-top:6px}.pcard p{font-size:14.5px;color:var(--ink2)}
.pcard ul{margin:0;padding-left:1.2em;display:grid;gap:4px;color:var(--ink2);font-size:14.5px}
.link{background:none;border:0;padding:0;font-weight:600;color:var(--accent);text-decoration:underline;cursor:pointer;min-height:36px}
.sched{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fbq{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:grid;gap:4px;margin:0}
.fbq legend{font-weight:600;padding:0 4px}
.fbq label{display:flex;gap:10px;align-items:center;min-height:38px}
.legal{margin-top:36px;font-size:12.5px;color:var(--ink2)}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.linkrow{flex-basis:100%;display:grid;gap:8px;max-width:520px;padding:4px 0 8px}
/* player */
#player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.pl-top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;flex-wrap:wrap}
.pl-top .tt{font:600 1rem var(--display);flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:5px;background:var(--sunken);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.pl-body{flex:1;overflow:auto;display:flex}
.pl-in{margin:auto;width:100%;max-width:40rem;padding:26px 0;display:grid;gap:16px}
.pl-in h2{font-size:clamp(1.5rem,4.5vw,2.1rem)}
.pl-meta{display:flex;gap:10px;align-items:center;color:var(--ink2);font-size:13.5px}
.pl-ctl{display:flex;gap:12px;justify-content:space-between;padding:12px 0 16px;border-top:1px solid var(--line)}
.pl-ctl .primary{flex:1;max-width:340px;margin-left:auto}
.beads{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--ink2)}
.bead{width:15px;height:15px;border-radius:50%;border:2px solid var(--accent)}
.bead.on{background:var(--accent)}
.mslot{display:grid}
.mslot video,.mslot audio{width:100%;border-radius:10px}
.center{text-align:center;justify-items:center}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:min(92vw,520px);text-align:center}
@media(min-width:900px){#toast{bottom:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="side">
    <a class="brand" href="#library" aria-label="PRAYERFLOW home">
      <span class="mark">PRAYERFLOW</span><span class="sub">A Symphony of Prayer</span><span class="tag">Free to Pray. Free to Share.</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <p class="side-foot">No subscriptions, no ads, no interruptions. Prototype preview: your playlists are saved in this browser only.</p>
  </aside>
  <main id="main"></main>
</div>
<section id="player" role="dialog" aria-modal="true" aria-label="Prayer session" hidden></section>
<section id="policy" role="dialog" aria-modal="true" aria-label="Content and rights" hidden></section>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="mre" accept="audio/*,video/mp4,.mp3,.mp4,.m4a" hidden data-act="mre">

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const clone=o=>JSON.parse(JSON.stringify(o));
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(16)};
const paras=t=>esc(t).split(/\n\n+/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
const fmtDur=s=>s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'length unknown';
const fmtDate=ms=>new Date(ms).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const ORD=['First','Second','Third','Fourth','Fifth'];

/* ---------- content ---------- */
const SIGN='In the name of the Father, and of the Son, and of the Holy Spirit. Amen.';
const PRAYERS=[
 {id:'our-father',title:'Our Father',cat:'Foundational',text:'Our Father, who art in heaven,\nhallowed be thy name;\nthy kingdom come,\nthy will be done\non earth as it is in heaven.\n\nGive us this day our daily bread,\nand forgive us our trespasses\nas we forgive those who trespass against us;\nand lead us not into temptation,\nbut deliver us from evil.\n\nAmen.'},
 {id:'hail-mary',title:'Hail Mary',cat:'Marian',text:'Hail Mary, full of grace,\nthe Lord is with thee;\nblessed art thou amongst women,\nand blessed is the fruit of thy womb, Jesus.\n\nHoly Mary, Mother of God,\npray for us sinners,\nnow and at the hour of our death.\n\nAmen.'},
 {id:'glory-be',title:'Glory Be',cat:'Doxology',text:'Glory be to the Father,\nand to the Son,\nand to the Holy Spirit,\nas it was in the beginning,\nis now, and ever shall be,\nworld without end.\n\nAmen.'},
 {id:'apostles-creed',title:'Apostles’ Creed',cat:'Creed',text:'I believe in God, the Father almighty,\nCreator of heaven and earth,\nand in Jesus Christ, his only Son, our Lord,\nwho was conceived by the Holy Spirit,\nborn of the Virgin Mary,\nsuffered under Pontius Pilate,\nwas crucified, died and was buried;\nhe descended into hell;\non the third day he rose again from the dead;\nhe ascended into heaven,\nand is seated at the right hand of God the Father almighty;\nfrom there he will come to judge the living and the dead.\n\nI believe in the Holy Spirit,\nthe holy catholic Church,\nthe communion of saints,\nthe forgiveness of sins,\nthe resurrection of the body,\nand life everlasting.\n\nAmen.'},
 {id:'hail-holy-queen',title:'Hail Holy Queen',cat:'Marian',text:'Hail, holy Queen, Mother of mercy,\nour life, our sweetness and our hope.\nTo thee do we cry, poor banished children of Eve;\nto thee do we send up our sighs,\nmourning and weeping in this valley of tears.\n\nTurn then, most gracious advocate,\nthine eyes of mercy toward us,\nand after this our exile,\nshow unto us the blessed fruit of thy womb, Jesus.\n\nO clement, O loving, O sweet Virgin Mary.\n\nPray for us, O holy Mother of God,\nthat we may be made worthy of the promises of Christ.\n\nAmen.'}
];
/* Group prayer line-up (from the group's printed list). Obvious typing errors were corrected; wording awaits review. */
[
 {id:'fatima-prayer',title:'O My Jesus',cat:'Group prayers',text:`O my Jesus, forgive us our sins, save us from the fires of hell, and lead all souls to heaven, especially those who are in most need of your mercy.`},
 {id:'our-lady-of-all-nations',title:'Our Lady of All Nations',cat:'Group prayers',text:`Lord Jesus Christ, Son of the Father, send now Your Spirit over the earth. Let the Holy Spirit live in the hearts of all nations, that they may be preserved from degeneration, disaster and war. May the Lady of All Nations, the Blessed Virgin Mary, be our Advocate. Amen.`},
 {id:'holy-souls-gertrude',title:'Prayer for the Holy Souls in Purgatory',cat:'Group prayers',text:`Eternal Father, we offer You the Most Precious Blood of Your Divine Son, Jesus, in union with the Holy Masses said throughout the world today, for all the holy souls in purgatory, for sinners everywhere, for sinners in the universal Church, those in my own home and within my family. Amen.`,note:'Attributed to St. Gertrude the Great on the group list. Reviewer to confirm.'},
 {id:'rosary-closing',title:'Rosary Closing Prayer',cat:'Group prayers',text:`Let us pray.\n\nO God, whose only begotten Son, by His life, death, and resurrection, has purchased for us the rewards of eternal life, grant, we beseech Thee, that meditating upon these mysteries of the most holy Rosary of the Blessed Virgin Mary, we may imitate what they contain and obtain what they promise, through Christ our Lord. Amen.`},
 {id:'memorare',title:'The Memorare',cat:'Group prayers',text:`Remember, O most gracious Virgin Mary, that never was it known that anyone who fled to thy protection, implored thy help, or sought thy intercession, was left unaided. Inspired by this confidence, we fly unto thee, O Virgin of virgins, our Mother. To thee we come, before thee we stand, sinful and sorrowful. O Mother of the Word Incarnate, despise not our petitions, but in thy mercy hear and answer us. Amen.`},
 {id:'dm-opening',title:'Divine Mercy: Opening Prayer',cat:'Divine Mercy Chaplet',text:`You expired, Jesus, but the source of life gushed forth for souls, and the ocean of mercy opened up for the whole world. O Fount of Life, unfathomable Divine Mercy, envelop the whole world and empty Yourself out upon us.`},
 {id:'dm-blood-water',title:'Divine Mercy: O Blood and Water',cat:'Divine Mercy Chaplet',text:`O Blood and Water, which gushed forth from the Heart of Jesus as a fountain of mercy for us, we trust in You!`},
 {id:'dm-offering',title:'Divine Mercy: Eternal Father',cat:'Divine Mercy Chaplet',text:`Eternal Father, we offer You the Body and Blood, Soul and Divinity of Your Dearly Beloved Son, Our Lord, Jesus Christ, in atonement for our sins and those of the whole world.`},
 {id:'dm-decade',title:'Divine Mercy: For the Sake of His Sorrowful Passion',cat:'Divine Mercy Chaplet',text:`For the sake of His sorrowful Passion, have mercy on us and on the whole world.`},
 {id:'dm-holy-god',title:'Divine Mercy: Holy God',cat:'Divine Mercy Chaplet',text:`Holy God, Holy Mighty One, Holy Immortal One, have mercy on us and on the whole world.`},
 {id:'dm-closing',title:'Divine Mercy: Closing Prayer',cat:'Divine Mercy Chaplet',text:`Eternal God, in whom mercy is endless and the treasury of compassion inexhaustible, look kindly upon us and increase Your mercy in us, that in difficult moments we might not despair nor become despondent, but with great confidence submit ourselves to Your holy will, which is love and mercy itself. Amen.`},
 {id:'holy-spirit-day',title:'Prayer of the Day to the Holy Spirit',cat:'Group prayers',text:`Come, Holy Spirit, our God and our Creator! Come to us from Your throne in heaven. Come and take possession of our lives and make them all Your own. You are the living spring and the burning fire in our lives. Holy Spirit, please guide our minds with Your light, and inflame our hearts with Your love.\n\nBeneath Your sacred wings lead us safely from all our sins, perils and troubles in contemporary life. Through You, may we come to know God our Father and Jesus our brother. Amen.`},
 {id:'peace-ukraine-israel-palestine',title:'Prayer for Ukraine, Israel and Palestine',cat:'Group prayers',text:`God of peace and justice, we pray for the people of Ukraine, Israel and Palestine. We pray for peace and the laying down of weapons. We pray for all those who are in fear, that Your Spirit of comfort would draw near to them. We pray for those with power over war or peace, for wisdom, discernment and compassion to guide their decisions. Above all, we pray for all Your precious children, at risk and in fear, that You would hold and protect them. We pray in the name of Jesus, the Prince of Peace, and through Mary, the Queen of Peace. Amen.`},
 {id:'prayer-philippines',title:'Prayer for the Philippines',cat:'Group prayers',text:`Dear Heavenly Father, Lord, bless our country. Send us Your Holy Spirit, especially in our stand against corruption. Bless every voice raised for justice, every step taken in faith, and every soul seeking a brighter Philippines. Help us build a nation where honesty flourishes, where the poor are lifted, and where Your light shines through every act of courage. We trust in Your perfect plan. In Jesus' name, we pray. Amen.`},
 {id:'prayer-russia',title:'Prayer for Russia',cat:'Group prayers',text:`Our Lady of Fatima, gently look down on each Russian village and city and town. Dear Star of the Morning, now cleanse in thy beams the Red Star of Russia that balefully gleams. Our rosaries rise to thee, Lady of Light; oh, hasten the dawn of the world's weary night. We trust in thy power; one plea to thy Son, and Russia's conversion will swiftly be won. Amen.`,note:'Source and wording to be confirmed by the reviewer.'},
 {id:'prayer-calamities',title:'Prayer Against Earthquakes and Other Calamities',cat:'Group prayers',text:`Lord, as we stand helpless in these calamities: typhoons, floods, earthquakes, volcanic eruptions, El Niño and COVID in our country, we implore the name of Jesus and the power of the Holy Spirit to save us all. Please protect our families, houses, roads, bridges, buildings and churches from nature's wrath, and keep us all safe, Lord. This we ask in the mighty name of Jesus. Amen.`,note:'Mentions COVID. The reviewer may want to update the wording.'},
 {id:'st-john-vianney-priests',title:'St. John Vianney’s Prayer for Priests',cat:'Group prayers',text:`God, please give to Your Church today many more priests after Your own heart. May they be worthy representatives of Christ the Good Shepherd. May they wholeheartedly devote themselves to prayer and penance; be examples of humility and poverty; shining models of holiness; tireless and powerful preachers of the Word of God; zealous dispensers of Your grace in the sacraments. May their loving devotion to Your Son Jesus in the Eucharist, and to Mary, His Mother, be the twin fountains of fruitfulness for their ministry. Amen.`},
 {id:'st-michael',title:'Prayer to St. Michael the Archangel',cat:'Group prayers',text:`St. Michael the Archangel, defend us in the day of the battle. Be our protection against the wickedness and the snares of the devil. May God rebuke him, we humbly pray, and do thou, O Prince of the heavenly hosts, by the power of God, thrust into hell Satan and all the evil spirits who prowl around the world seeking the ruin of souls. Amen.`},
 {id:'guardian-angel',title:'Prayer to Our Guardian Angel',cat:'Group prayers',text:`Angel of God, my guardian dear, to whom God's love commits me here, ever this day be at my side, to light and guard, to rule and guide. Amen.`},
 {id:'pope-francis-prayer',title:'Prayer Listed as Pope Francis’ Prayer',cat:'Group prayers',text:`Holy Trinity, God Almighty, Blood of Christ: destroy the devil, disable and paralyze the traps of those manipulating the whole world.\n\nImmaculate Heart of Mary: trample on the devil, disable and paralyze the traps of those who are manipulating the whole world.\n\nSt. Michael the Archangel: trample on the devil, disable and paralyze the traps of those who are manipulating the whole world. Amen.`,note:'The attribution to Pope Francis is not verified. The reviewer should confirm the source and wording before wide use.'},
 {id:'cleansing-prayer',title:'Cleansing Prayer',cat:'Group prayers',text:`Heavenly Father, in the name of Jesus Christ our Lord and Savior, by the power of the Holy Spirit, we pray that the cleansing power of the Precious Blood of Your Son come upon us right now. Purify us and wash us clean with the Blood of Jesus from the top of our heads down to the very soles of our feet. Let this Blood penetrate the very marrow of our bones to cleanse us from any entanglement, from whatever spirit we have come in contact with during the course of the day. Anoint us with the gift of the Holy Spirit and refresh our body, soul and spirit. And may the sign of Your Holy Cross (+) drive away all the evil spirits from us. Amen.`,note:'The reviewer should confirm the wording and its use in a group prayer.'},
 {id:'closing-blessing',title:'Closing Prayers and Blessing',cat:'Group prayers',text:`May the divine assistance remain always with us. Amen.\n\nMay the souls of the faithful departed, through the mercy of God, rest in peace. Amen.\n\nMay the blessing of Almighty God, the Father, the Son and the Holy Spirit, remain with us and our loved ones now and forever. Amen.`}
].forEach(p=>{p.group=true;PRAYERS.push(p)});

function prayerOpts(q){q=norm(q).trim();
  const rows=allPrayers().filter(x=>!q||norm(x.title+' '+x.cat).includes(q));
  return ((!q||norm('Sign of the Cross').includes(q))?'<option value="step:sign">Sign of the Cross</option>':'')+rows.map(x=>`<option value="prayer:${x.id}">${esc(x.title)}</option>`).join('')||'<option value="">No match. Paste it below.</option>'}
function hymnOpts(q){q=norm(q).trim();
  const rows=HYMNS.filter(h=>!q||norm(h.title+' '+h.lang+' '+h.uses.join(' ')).includes(q));
  const med=D.media.filter(m=>q&&norm(m.title).includes(q));
  return rows.map(h=>`<option value="hymn:${h.id}">${esc(h.title)} · ${esc(h.lang)}</option>`).join('')+med.map(m=>`<option value="media:${m.id}">Recording: ${esc(m.title)}</option>`).join('')||'<option value="">No match. Add the title below.</option>'}

/* ---------- playlist model ---------- */
function newPl(title,items,kind){const now=Date.now();const pl={id:uid(),title,desc:'',rev:1,created:now,modified:now,items:items||[]};if(kind)pl.kind=kind;D.playlists.unshift(pl);persist();return pl}
function addTo(target,items){
  items=clone(items).map(i=>(i.id=uid(),i));
  if(target==='__new'||!target){const pl=newPl('New playlist',items);toast('Created “'+pl.title+'”.');return}
  if(S.ply.draft&&S.ply.draft.id===target){S.ply.draft.items.push(...items);S.ply.dirty=true;toast('Added to the playlist you are editing. Save to keep it.');return}
  const pl=D.playlists.find(p=>p.id===target);if(!pl)return;
  pl.items.push(...items);pl.rev++;pl.modified=Date.now();persist();toast('Added to “'+pl.title+'”.');
}
function openPl(id){const pl=D.playlists.find(p=>p.id===id);S.ply.sel=id;S.ply.draft=pl?clone(pl):null;S.ply.dirty=false}
function go(page){if(location.hash.slice(1)===page)route();else location.hash=page}
function rosaryItems(set){
  const it=[mk('hymn','Opening hymn'),mk('step','Sign of the Cross',SIGN),pi('apostles-creed'),pi('our-father'),pi('hail-mary',3),pi('glory-be')];
  MYST[set].forEach((m,i)=>{
    it.push(mk('meditation',ORD[i]+' Mystery: '+m,set+' Mysteries\n\nAnnounce the mystery. Add a reviewed meditation here, in the playlist builder.'));
    it.push(pi('our-father'),pi('hail-mary',10),pi('glory-be'));
  });
  it.push(pi('hail-holy-queen'),mk('hymn','Closing hymn'));return it;
}
function novenaItems(n,day){
  const intent=n.days?'Intention: '+n.days[day-1]+'\n\n':'';
  const core=[mk('step','Sign of the Cross',SIGN),mk('meditation',n.title+' · Day '+day,intent+'Add the reviewed text for this day in the playlist builder.'),
    pi('our-father'),pi('hail-mary'),pi('glory-be'),mk('meditation','Closing prayer','Add the reviewed closing prayer in the playlist builder.')];
  return n.openCloseHymns?[mk('hymn','Opening hymn'),...core,mk('hymn','Closing hymn')]:core;
}

function manifest(pl,withLinks){
  const items=pl.items.map(it=>{const m=it.media&&MD(it.media);return {kind:it.kind,title:it.title,text:it.text,repeat:it.repeat||1,ref:it.ref||null,part:it.part||null,comp:it.comp||null,link:withLinks?linkFor(it):null,media:m?{title:m.title,type:m.type,included:false}:null}});
  return {schema:'prayerflow.session',version:1,playlistKind:pl.kind||null,title:pl.title,description:pl.desc||'',notice:withLinks?'Text, order and the sender’s song links. No audio or video is included. The sender confirms they may share this text and these links.':'Text and order only. No audio, video or links are included. The sender confirms they may share this text.',items,integrity:hash(JSON.stringify([pl.title,items]))};
}
function validateImport(txt){
  let o;try{o=JSON.parse(txt)}catch(e){return {err:'This is not a readable session package. Paste the full text that was copied from PRAYERFLOW.'}}
  if(!o||o.schema!=='prayerflow.session')return {err:'This package is not a PRAYERFLOW session.'};
  if(o.version!==1)return {err:'This package uses version '+esc(o.version)+', which this app does not support yet.'};
  if(typeof o.title!=='string'||!o.title.trim()||o.title.length>200)return {err:'The package has no usable title.'};
  if(!Array.isArray(o.items)||!o.items.length)return {err:'The package has no items.'};
  if(o.items.length>200)return {err:'The package is too large. Sessions are limited to 200 items.'};
  for(const it of o.items){
    if(!it||!KIND[it.kind]||typeof it.title!=='string'||it.title.length>200||typeof(it.text||'')!=='string'||(it.text||'').length>20000)return {err:'One of the items is malformed, so nothing was imported.'};
    const r=Number(it.repeat||1);if(!Number.isInteger(r)||r<1||r>60)return {err:'One of the items has an invalid repeat count.'};
    if(it.link!=null&&(typeof it.link!=='string'||it.link.length>500||!/^https:\/\//i.test(it.link)))return {err:'One of the items has a link that is not a safe https address, so nothing was imported.'};
    if((it.part!=null&&(typeof it.part!=='string'||it.part.length>80))||(it.comp!=null&&(typeof it.comp!=='string'||it.comp.length>100)))return {err:'One of the items is malformed, so nothing was imported.'};
  }
  if(o.integrity!==hash(JSON.stringify([o.title,o.items])))return {err:'The integrity check failed. The package was changed or copied incompletely, so nothing was imported.'};
  const missing=o.items.filter(i=>i.media&&!i.link).length;
  return {ok:true,pkg:o,missing};
}

/* ---------- player ---------- */
const isText=it=>it.kind!=='hymn'&&it.kind!=='media';
function stopMedia(){const P=S.play;if(P&&P.el){try{P.el.pause();P.el.removeAttribute('src');P.el.load()}catch(e){}P.el=null}if(P&&P.url){URL.revokeObjectURL(P.url);P.url=null}}
function follow(pl){stopMedia();S.play={pl:clone(pl),i:0,rep:1,done:false,el:null,url:null};renderPlayer()}
function mediaBlock(it){
  const m=it.media&&MD(it.media),h=it.ref&&HY(it.ref);
  const sub=h?`<p class="note">Hymn: ${esc(h.title)}</p>`:(it.comp?`<p class="note">Composer: ${esc(it.comp)}</p>`:'');
  if(m&&m.type==='link'){const dir=/\.(mp3|m4a|mp4|wav|ogg|aac)(\?|#|$)/i.test(m.url);return sub+`<div class="callout"><b>${esc(m.title)}</b><br>This song is a link. Tap Open song, listen, then come back here and tap Next.</div><div class="actions"><a class="btn primary big" href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">Open song</a></div>${dir?'<div class="mslot" id="mslot"></div>':''}`}
  if(m&&FILES[m.id])return sub+`<div class="mslot" id="mslot"></div><p class="note">Playing “${esc(m.title)}”. The next step opens when it ends, or tap Next to move on.</p>`;
  const why=m?'This recording is not attached on this device right now. Re-attach it in Catholic Hymns, then try again.':(it.kind==='hymn'&&!h&&!it.custom?(it.ref?'This hymn is no longer in the library. Choose another one in the playlist builder.':'No hymn has been chosen for this step.'):'No recording is attached to this step.');
  const L=h&&D.links[h.id],lib=h&&!L&&!m&&h.yt;
  return sub+`<div class="callout">${lib?(h.ytOk?'This song opens on YouTube from the library list. Tap the button, listen, then come back here and tap Next.':'The recording for this song is not verified. The button opens a YouTube search, so check that it is the right version, then come back and tap Next.'):why+' Nothing was skipped silently. Use Next to move on.'}</div><div class="actions">${L?`<a class="btn primary big" href="${esc(L.url)}" target="_blank" rel="noopener noreferrer">Open my link</a>`:(lib?`<a class="btn primary big" href="${esc(h.yt)}" target="_blank" rel="noopener noreferrer">${h.ytOk?'Open on YouTube':'Search YouTube (unverified)'}</a>`:'')}${lib?'':'<button class="btn" data-act="plretry">Try again</button>'}</div>`;
}
function renderPlayer(){
  const el=$('#player'),P=S.play;
  if(!P){el.hidden=true;el.innerHTML='';document.body.classList.remove('locked');return}
  el.hidden=false;document.body.classList.add('locked');
  const items=P.pl.items,n=items.length;
  if(P.done){
    el.innerHTML=`<div class="pl-top"><span class="tt">${esc(P.pl.title)}</span></div><div class="bar"><i style="width:100%"></i></div><div class="pl-body"><div class="pl-in center"><h2>Session complete</h2><p class="note">Amen. You followed all ${n} steps of “${esc(P.pl.title)}”.</p><div class="actions"><button class="btn primary big" data-act="plrestart">Pray again</button><button class="btn big" data-act="plstop">Close</button></div></div></div>`;return}
  const it=items[P.i],txt=isText(it),reps=txt?(it.repeat||1):1,last=P.i===n-1&&P.rep>=reps;
  const pct=(P.i+(P.rep-1)/reps)/n*100;
  const beads=reps>1?`<div class="beads" aria-label="${esc(it.title)} ${P.rep} of ${reps}">${reps<=12?Array.from({length:reps},(_,k)=>`<span class="bead ${k<P.rep?'on':''}"></span>`).join(''):''}<span>${esc(it.title)} ${P.rep} of ${reps}</span></div>`:'';
  const body=txt?(it.text.trim()?`<div class="prayer">${paras(it.text)}</div>`:`<p class="note">This step has no text yet. Add it in the playlist builder.</p>`)+beads:mediaBlock(it);
  el.innerHTML=`<div class="pl-top"><button class="btn sm" data-act="plstop">Stop</button><span class="tt">${esc(P.pl.title)}</span>${sizeCtl()}</div>
  <div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="${n}" aria-valuenow="${P.i+1}"><i style="width:${pct}%"></i></div>
  <div class="pl-body"><div class="pl-in"><div class="pl-meta"><span class="chip ${txt?'':'acc'}">${KIND[it.kind]}${it.part?' · '+esc(it.part):''}</span><span>Step ${P.i+1} of ${n}</span></div><h2>${esc(it.title)}</h2>${body}</div></div>
  <div class="pl-ctl"><button class="btn big" data-act="plprev" ${P.i===0&&P.rep===1?'disabled':''}>Previous</button><button class="btn primary big" data-act="plnext">${last?'Finish':'Next'}</button></div>`;
  mountMedia(it);
  const nb=el.querySelector('[data-act=plnext]');if(nb&&!txt===false)nb.focus({preventScroll:true});
}
function mountMedia(it){
  const slot=$('#mslot'),m=it.media&&MD(it.media);if(!slot||!m)return;const lk=m.type==='link';if(!lk&&!FILES[m.id])return;
  const e=document.createElement(m.type==='video'||(lk&&/\.mp4(\?|#|$)/i.test(m.url))?'video':'audio');e.controls=true;e.playsInline=true;
  const url=lk?m.url:URL.createObjectURL(FILES[m.id]);S.play.url=lk?null:url;S.play.el=e;e.src=url;
  e.addEventListener('ended',()=>ACT.plnext());
  e.addEventListener('error',()=>{slot.innerHTML=lk?'<div class="callout">This link cannot play inside PRAYERFLOW. Use Open song above.</div>':'<div class="callout">This file could not be played on this device. Use Next to skip it, or check the file format.</div>'});
  slot.appendChild(e);const pr=e.play();if(pr&&pr.catch)pr.catch(()=>{});
}

 Sorrowful:['The Agony in the Garden','The Scourging at the Pillar','The Crowning with Thorns','The Carrying of the Cross','The Crucifixion and Death of our Lord Jesus Christ'],

};
const pr=(id,rep)=>{const p=PR(id);return mk('prayer',p.title,p.text,{ref:id,repeat:rep||1})};

    parts:[{type:'core'},{type:'mysteries'},P('our-lady-of-all-nations'),P('holy-souls-gertrude'),P('hail-holy-queen'),P('rosary-closing'),P('memorare'),{type:'chaplet'},P('holy-spirit-day'),P('peace-ukraine-israel-palestine'),P('prayer-philippines'),P('prayer-russia'),P('prayer-calamities'),P('st-john-vianney-priests'),P('st-michael'),P('guardian-angel'),P('pope-francis-prayer'),{type:'intentions'},P('cleansing-prayer'),P('closing-blessing')]};
}
const dateKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const todaySet=()=>S.gset||D.group.schedule[new Date().getDay()];
function chaplet(){
  const it=[pr('dm-opening'),pr('dm-blood-water',3),pr('our-father'),pr('hail-mary'),pr('apostles-creed')];
  for(let d=1;d<=5;d++){
    it.push(mk('prayer','Eternal Father · decade '+d+' of 5',PR('dm-offering').text,{ref:'dm-offering'}));
    it.push(mk('prayer','For the sake of His sorrowful Passion · decade '+d+' of 5',PR('dm-decade').text,{ref:'dm-decade',repeat:10}));
  }
  it.push(pr('dm-holy-god',3),mk('prayer','Jesus, King of Mercy','Jesus, King of Mercy, we trust in You.'),pr('dm-closing'));
  return it;
}
function groupSession(set){
  const g=D.group,out=[];
  g.parts.forEach(pt=>{
    if(pt.type==='core')out.push(pr('apostles-creed'),pr('our-father'),pr('hail-mary',3),pr('glory-be'));
    else if(pt.type==='mysteries')GM[set].forEach((m,i)=>out.push(mk('meditation',ORD[i]+' '+set+' Mystery',m),pr('our-father'),pr('hail-mary',10),pr('glory-be'),pr('fatima-prayer')));
    else if(pt.type==='chaplet')out.push(...chaplet());
    else if(pt.type==='intentions')out.push(mk('meditation','Intentions of the Holy Father','For the intentions of the Holy Father and our personal intentions.'),pr('our-father'),pr('hail-mary'),pr('glory-be'));
    else if(pt.type==='prayer'&&PR(pt.ref))out.push(pr(pt.ref,pt.repeat));
  });
  return {title:g.name+' · '+set+' Mysteries',items:out};
}

/* ---------- group line-up link ---------- */
const SETC={Joyful:'J',Luminous:'L',Sorrowful:'S',Glorious:'G'};
const PARTC={core:'~core',mysteries:'~mys',chaplet:'~chap',intentions:'~int'};
const b64u=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
function groupLink(){
  const g=D.group;
  const parts=g.parts.filter(p=>p.type!=='prayer'||!/^mine-/.test(p.ref)).map(p=>p.type==='prayer'?p.ref+((p.repeat||1)>1?'*'+p.repeat:''):PARTC[p.type]);
  const code=b64u(JSON.stringify({v:1,n:g.name,s:[0,1,2,3,4,5,6].map(i=>SETC[g.schedule[i]]).join(''),p:parts,j:g.joinLink||''}));
  return location.origin+location.pathname+'#g='+code;
}
function decodeGroup(code){
  const bad={err:'This link is not a PRAYERFLOW line-up, or it was cut short. Ask your prayer leader to send it again.'};
  let o;try{o=JSON.parse(unb64u(code))}catch(e){return bad}
  if(!o||o.v!==1||typeof o.n!=='string'||!o.n.trim()||o.n.length>60||typeof o.s!=='string'||o.s.length!==7||!Array.isArray(o.p)||o.p.length>80)return bad;
  const rev={};Object.keys(SETC).forEach(k=>{rev[SETC[k]]=k});
  const schedule={};for(let i=0;i<7;i++){const k=rev[o.s[i]];if(!k)return bad;schedule[i]=k}
  const back={};Object.keys(PARTC).forEach(k=>{back[PARTC[k]]=k});
  const parts=[];let missing=0;
  for(const x of o.p){
    if(typeof x!=='string'||x.length>80)return bad;
    if(back[x]){parts.push({type:back[x]});continue}
    const a=x.split('*'),r=a[1]?parseInt(a[1],10):1;
    if(!(r>=1&&r<=60))return bad;
    if(!PR(a[0])){missing++;continue}
    parts.push({type:'prayer',ref:a[0],repeat:r});
  }
  if(!parts.length)return bad;
  let j='';if(typeof o.j==='string'&&o.j){try{const u=new URL(o.j);if(u.protocol==='https:')j=u.href}catch(e){}}
  return {ok:true,g:{name:o.n.trim(),schedule,parts,joinLink:j},missing};
}
function openLineup(code){
  try{history.replaceState(null,'',location.pathname+location.search+'#library')}catch(e){}
  S.page='library';S.confirm=null;window.scrollTo(0,0);render();
  POL.open=true;POL.view='lineup';POL.lineup=decodeGroup(code);POL.after=null;renderPolicy();
  const c=$('#policy .pcard');if(c)c.focus();
}

   if(lu.protocol!=='https:')return err('Only https links are accepted.');
   if(D.media.some(m=>m.url===lu.href))return err('This link is already in your recordings.')}
  if(!D.ack){openPolicy(()=>ACT.madd());return}
  if(!f){D.media.push({id:'m-'+uid(),title,type:'link',url:lu.href,dur:0,name:lu.hostname.replace(/^www\./,''),size:0,src});persist();S.hy.err='';toast('Link added.');render();return}
  if(f.size>200*1024*1024)return err('This file is larger than 200 MB. Choose a smaller one.');
  if(D.media.some(m=>m.name===f.name&&m.size===f.size))return err('This file is already in your recordings.');
  const video=f.type==='video/mp4'||/\.mp4$/i.test(f.name)&&f.type.startsWith('video'),e=document.createElement(video?'video':'audio'),url=URL.createObjectURL(f);
  e.preload='metadata';
  e.onloadedmetadata=()=>{const id='m-'+uid();FILES[id]=f;D.media.push({id,title,type:video?'video':'audio',dur:Math.round(e.duration)||0,name:f.name,size:f.size,src});persist();URL.revokeObjectURL(url);S.hy.err='';S.hy.file=null;toast('Recording added.');render()};
  e.onerror=()=>{URL.revokeObjectURL(url);err('This file could not be read as audio or video on this device. Check that it is a standard MP3, M4A or MP4.')};
  e.src=url;
 },
 mprev(b){S.hy.prev=S.hy.prev===b.dataset.id?null:b.dataset.id;render()},
 mre(b){S.hy.re=b.dataset.id;$('#mre').click()},
 mrm(b){const id=b.dataset.id;if(!twoStep('mrm'+id))return;
  const n=D.playlists.filter(p=>p.items.some(i=>i.media===id)).length;
  D.media=D.media.filter(m=>m.id!==id);delete FILES[id];D.playlists.forEach(p=>p.items.forEach(i=>{if(i.media===id)i.media=null}));persist();
  toast(n?'Removed. '+n+' playlist'+(n>1?'s':'')+' now show that step as having no recording.':'Recording removed.');render()},
 /* parish */
 plannew(){const t=S.par.newType,p={id:uid(),type:t,title:PT[t].label,date:'',coordinator:'',reviewer:'',status:'Draft',notes:'',slots:PT[t].slots.map(l=>({label:l,ref:'',note:''}))};D.plans.unshift(p);persist();S.par.sel=p.id;window.scrollTo(0,0);render()},
 planopen(b){S.par.sel=b.dataset.id;S.confirm=null;window.scrollTo(0,0);render()},
 planback(){S.par.sel=null;S.confirm=null;render()},
 plandup(){const s=D.plans.find(p=>p.id===S.par.sel),p=clone(s);p.id=uid();p.title=s.title+' (copy)';p.status='Draft';D.plans.unshift(p);persist();S.par.sel=p.id;toast('Duplicated as a new draft.');render()},
 plandel(){if(!twoStep('plandel'))return;D.plans=D.plans.filter(p=>p.id!==S.par.sel);persist();S.par.sel=null;toast('Plan deleted.');render()},
 planbuild(){const p=D.plans.find(x=>x.id===S.par.sel);const items=[];let empty=0;
  p.slots.forEach(s=>{
   if(s.ref.startsWith('h:')){const h=HY(s.ref.slice(2));items.push(mk('hymn',s.label+': '+h.title,s.note,{ref:h.id}))}
   else if(s.ref.startsWith('p:')){const src=D.playlists.find(x=>x.id===s.ref.slice(2));if(src)clone(src.items).forEach(i=>{i.id=uid();items.push(i)})}
   else if(s.note.trim())items.push(mk('meditation',s.label,s.note));
   else empty++;
  });
  if(!items.length){toast('Fill at least one slot first.');return}
  const pl=newPl(p.title,items);openPl(pl.id);toast(empty?'Playlist built. '+empty+' empty slot'+(empty>1?'s were':' was')+' left out.':'Playlist built.');go('playlists')}
};
function pi_(p){return mk('prayer',p.title,p.text,{ref:p.id})}

const INP={
 psearch(t){const s=$('#paddsel');if(s)s.innerHTML=prayerOpts(t.value)},
 hsearch(t){const s=$('#haddsel');if(s)s.innerHTML=hymnOpts(t.value)},
 libq(t){S.lib.q=t.value;$('#libList').innerHTML=libList()},
 gname(t){D.group.name=t.value;persist()},
 fbnote(t){D.fb.note=t.value;persist();updFb()},
 hyq(t){S.hy.q=t.value;$('#hyList').innerHTML=hyList()},
 ptitle(t){S.ply.draft.title=t.value;S.ply.dirty=true;refreshSaveBar()},
 pdesc(t){S.ply.draft.desc=t.value;S.ply.dirty=true;refreshSaveBar()},
 itext(t){S.ply.draft.items[+t.dataset.i].text=t.value;S.ply.dirty=true;refreshSaveBar()},
 imptxt(t){S.ply.impText=t.value;S.ply.imp=null},
 pname(t){const p=D.plans.find(x=>x.id===S.par.sel);p.title=t.value;persist()},
 pdate(t){D.plans.find(x=>x.id===S.par.sel).date=t.value;persist()},
 pcoord(t){D.plans.find(x=>x.id===S.par.sel).coordinator=t.value;persist()},
 prev(t){D.plans.find(x=>x.id===S.par.sel).reviewer=t.value;persist()},
 pnotes(t){D.plans.find(x=>x.id===S.par.sel).notes=t.value;persist()},
 slotnote(t){D.plans.find(x=>x.id===S.par.sel).slots[+t.dataset.i].note=t.value;persist()}
};
const CHG={
 nsel(t){S.rn.day=+t.value},
 gday(t){D.group.schedule[+t.dataset.i]=t.value;persist()},
 grep(t){const v=Math.max(1,Math.min(60,parseInt(t.value,10)||1));t.value=v;D.group.parts[+t.dataset.i].repeat=v;persist()},
 gjoin(t){const v=t.value.trim(),e=$('#gjerr');
  if(!v){D.group.joinLink='';persist();e.textContent='';return}
  let u;try{u=new URL(v)}catch(x){e.textContent='Paste a full web address that starts with https://';return}
  if(u.protocol!=='https:'){e.textContent='Only https links are accepted.';return}
  D.group.joinLink=u.href;persist();e.textContent='';toast('Group link saved.')},
 fbq(t){D.fb[t.name]=t.value;persist();updFb()},
 irep(t){const v=Math.max(1,Math.min(60,parseInt(t.value,10)||1));t.value=v;S.ply.draft.items[+t.dataset.i].repeat=v;S.ply.dirty=true;refreshSaveBar()},
 ihymn(t){const it=S.ply.draft.items[+t.dataset.i],h=HY(t.value);it.ref=t.value||null;if(it.auto&&h)it.title=h.title;S.ply.dirty=true;render()},
 imedia(t){const it=S.ply.draft.items[+t.dataset.i],m=MD(t.value);it.media=t.value||null;if(it.kind==='media'&&m)it.title=m.title;S.ply.dirty=true;render()},
 hytarget(t){S.hy.target=t.value},
 mfile(t){const f=t.files[0];S.hy.file=f||null;S.hy.err='';const ti=$('#mtitle');if(f&&!ti.value)ti.value=f.name.replace(/\.[^.]+$/,'');$('#merr').textContent=''},
 mre(t){const f=t.files[0];if(f&&S.hy.re){FILES[S.hy.re]=f;toast('File attached for this session.');t.value='';render()}},
 newtype(t){S.par.newType=t.value},
 polok(t){const b=$('[data-act=polagree]');if(b)b.disabled=!t.checked},
 shlinks(t){S.ply.links=t.checked;render()},
 ipart(t){S.ply.draft.items[+t.dataset.i].part=t.value||null;S.ply.dirty=true;render()},
 shok(t){const b=$('[data-act=copy]');if(b)b.disabled=!t.checked},
 pstatus(t){const p=D.plans.find(x=>x.id===S.par.sel);
  if(t.value==='Reviewed'&&!p.reviewer.trim()){toast('Add the reviewer’s name before marking this plan as reviewed.');render();return}
  p.status=t.value;persist();render()},
 slotref(t){D.plans.find(x=>x.id===S.par.sel).slots[+t.dataset.i].ref=t.value;persist();render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||/^(INPUT|SELECT|TEXTAREA)$/.test(b.tagName))return;
  const f=ACT[b.dataset.act];if(f){if(!/^(libnav|nday|up|down)$/.test(b.dataset.act)&&S.confirm&&!/^(delmine|pldel|plandel|mrm|greset)$/.test(b.dataset.act))S.confirm=null;f(b,e)}});
document.addEventListener('input',e=>{const f=INP[e.target.dataset&&e.target.dataset.act];if(f)f(e.target,e)});
document.addEventListener('change',e=>{const f=CHG[e.target.dataset&&e.target.dataset.act];if(f)f(e.target,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&POL.open){ACT.polclose();return}if(!S.play)return;
  if(e.key==='Escape')ACT.plstop();
  else if(/^(INPUT|SELECT|TEXTAREA|VIDEO|AUDIO)$/.test(e.target.tagName))return;
  else if(e.key==='ArrowRight')ACT.plnext();else if(e.key==='ArrowLeft')ACT.plprev()});
window.addEventListener('hashchange',route);
route();
})();
